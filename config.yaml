# Swing-trading engine configuration.
# Every rule of the strategy lives here so it can be changed without touching code.

capital: 20000            # starting cash in INR

universe:
  # Nifty 50 constituents as of late 2026 (Yahoo Finance tickers).
  # Verify against NSE's official list periodically and edit here.
  # NOTE: using *today's* constituents for a backtest that starts in 2019 adds
  # survivorship bias (stocks that did badly and were dropped are missing).
  tickers:
    - ADANIENT.NS
    - ADANIPORTS.NS
    - APOLLOHOSP.NS
    - ASIANPAINT.NS
    - AXISBANK.NS
    - BAJAJ-AUTO.NS
    - BAJFINANCE.NS
    - BAJAJFINSV.NS
    - BEL.NS
    - BHARTIARTL.NS
    - CIPLA.NS
    - COALINDIA.NS
    - DRREDDY.NS
    - EICHERMOT.NS
    - ETERNAL.NS
    - GRASIM.NS
    - HCLTECH.NS
    - HDFCBANK.NS
    - HDFCLIFE.NS
    - HINDALCO.NS
    - HINDUNILVR.NS
    - ICICIBANK.NS
    - INDIGO.NS
    - INFY.NS
    - ITC.NS
    - JIOFIN.NS
    - JSWSTEEL.NS
    - KOTAKBANK.NS
    - LT.NS
    - M&M.NS
    - MARUTI.NS
    - MAXHEALTH.NS
    - NESTLEIND.NS
    - NTPC.NS
    - ONGC.NS
    - POWERGRID.NS
    - RELIANCE.NS
    - SBILIFE.NS
    - SBIN.NS
    - SHRIRAMFIN.NS
    - SUNPHARMA.NS
    - TATACONSUM.NS
    - TMPV.NS
    - TATASTEEL.NS
    - TCS.NS
    - TECHM.NS
    - TITAN.NS
    - TRENT.NS
    - ULTRACEMCO.NS
    - WIPRO.NS
  benchmark: ^NSEI

data:
  start: "2015-01-01"
  cache_dir: data/cache
  max_cache_age_hours: 12

strategy:
  take_profit: 0.05          # sell when the position is up this much
  take_profit_is_net: true   # true = the 5% is AFTER all charges on both legs
  max_positions: 6           # hold at most this many stocks (your plan: 5-8)
  min_position_value: 1500   # don't open positions smaller than this (DP charge eats them)
  cooldown_days: 5           # don't re-buy a stock within N trading days of selling it
  min_prob: 0.0              # only buy if model probability >= this (0 = always fill slots)
  # Your rule: never sell below the buy price. Both options below are OFF to honour it.
  # They exist only so the backtest can show what the rule costs or saves.
  max_hold_days: null        # e.g. 60 = sell at close after 60 trading days even at a loss
  stop_loss: null            # e.g. 0.15 = sell if down 15%

model:
  name: logreg               # logreg or hgb; logreg won on the 2019-2023 dev period
  horizon_days: 20           # label: does the stock reach +take_profit within this many days?
  first_test_date: "2019-01-01"   # walk-forward predictions start here
  holdout_start: "2024-01-01"     # never used for any choice; final honest check
  retrain_every_days: 63          # retrain roughly every quarter
  top_k: 5                        # for precision@k evaluation

costs:                       # Indian equity delivery (CNC), approx. Zerodha 2026 schedule
  brokerage: 0.0             # delivery brokerage is zero at Zerodha
  stt: 0.001                 # 0.1% on buy and sell
  exchange_txn: 0.0000297    # NSE transaction charge
  sebi: 0.000001             # Rs 10 per crore
  gst: 0.18                  # on brokerage + exchange + SEBI charges
  stamp_duty_buy: 0.00015    # 0.015% on buy side
  dp_charge_per_sell: 15.93  # flat per stock per sell day (incl. GST)
  slippage: 0.0005           # 0.05% worse fill on market-style entries
  stcg_tax: 0.20             # short-term capital gains tax (reported, not deducted daily)

backtest:
  random_baseline_runs: 20   # same rules, random picks - shows whether the model adds value
  stuck_days: 60             # a position held this long and still underwater counts as "stuck"
  output_dir: outputs

collect:                     # NSE data collectors (python -m trader collect ...)
  db_path: data/market.db
  store_all: true            # every EQ/BE stock (~2,300/day, ~700 MB for 2020+): needed for a point-in-time
                             # universe incl. stocks that later collapsed. false = Nifty 500 + ETFs + extras
  extra_symbols: []

paper:                         # Gate 1 paper trading (trader/paper.py) - no real orders
  capital: 100000              # per book: strategy part + Nifty 500 index-fund part
  strategy_share: 0.25         # owner's choice 2026-11-27 (75/25 keeps the worst fall ~21% in 2021-26)
  positions: 5
  exit_rank: 50                # sell when out of the top 50
  regime_ma: 200               # no new buys/sells while Nifty 500 is below this moving average
  etf_fee: 0.002               # index-fund expense ratio per year
  history_days: 800            # calendar days of market.db loaded for the signals
  db: data/paper.db
  books:                       # name: universe
    main: top500
    large: top200
